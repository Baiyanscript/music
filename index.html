<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funk Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .player {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .now-playing {
      background: #1d1d1d;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    #songName {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      word-break: break-all;
    }

    audio {
      width: 100%;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: #333;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #555;
    }

    .playlist {
      background: #1d1d1d;
      border-radius: 15px;
      padding: 10px;
    }

    .song {
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      word-break: break-all;
    }

    .song:hover {
      background: #333;
    }

    .song.active {
      background: #444;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="player">

  <h1>🎵 Funk Music</h1>

  <div class="now-playing">
    <div id="songName">尚未選擇歌曲</div>

    <audio id="audio" controls></audio>

    <div class="controls">
      <button onclick="previousSong()">⏮️</button>
      <button onclick="toggleRandom()">🔀</button>
      <button onclick="nextSong()">⏭️</button>
    </div>
  </div>

  <div class="playlist">
    <div id="status">正在讀取 GitHub 音樂...</div>
    <div id="playlist"></div>
  </div>

</div>

<script>

const API_URL =
  "https://api.github.com/repos/Baiyanscript/music/contents/funk";

const RAW_URL =
  "https://raw.githubusercontent.com/Baiyanscript/music/main/funk/";

const audio = document.getElementById("audio");
const playlist = document.getElementById("playlist");
const songName = document.getElementById("songName");
const status = document.getElementById("status");

let songs = [];
let currentIndex = 0;
let randomMode = false;


// 讀取 GitHub funk 資料夾
async function loadSongs() {

  try {

    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("GitHub API 讀取失敗");
    }

    const files = await response.json();

    songs = files.filter(file =>
      file.type === "file" &&
      file.name.toLowerCase().endsWith(".mp3")
    );

    if (songs.length === 0) {
      status.textContent = "找不到 MP3 音樂";
      return;
    }

    status.style.display = "none";

    songs.forEach((song, index) => {

      const item = document.createElement("div");

      item.className = "song";
      item.textContent = "🎵 " + song.name;

      item.onclick = () => {
        playSong(index);
      };

      playlist.appendChild(item);

    });

    playSong(0);

  } catch (error) {

    console.error(error);

    status.textContent =
      "無法讀取 GitHub 音樂：" + error.message;

  }
}


// 播放歌曲
function playSong(index) {

  if (!songs[index]) return;

  currentIndex = index;

  const song = songs[index];

  audio.src = RAW_URL + encodeURIComponent(song.name);

  songName.textContent = song.name;

  updateActiveSong();

  audio.play().catch(() => {});

}


// 更新目前歌曲
function updateActiveSong() {

  const items = document.querySelectorAll(".song");

  items.forEach((item, index) => {

    item.classList.toggle(
      "active",
      index === currentIndex
    );

  });

}


// 下一首
function nextSong() {

  if (songs.length === 0) return;

  if (randomMode) {

    let next;

    do {
      next = Math.floor(Math.random() * songs.length);
    }
    while (songs.length > 1 && next === currentIndex);

    currentIndex = next;

  } else {

    currentIndex++;

    if (currentIndex >= songs.length) {
      currentIndex = 0;
    }

  }

  playSong(currentIndex);
}


// 上一首
function previousSong() {

  if (songs.length === 0) return;

  currentIndex--;

  if (currentIndex < 0) {
    currentIndex = songs.length - 1;
  }

  playSong(currentIndex);
}


// 隨機播放
function toggleRandom() {

  randomMode = !randomMode;

  alert(
    randomMode
      ? "🔀 隨機播放：開啟"
      : "🔀 隨機播放：關閉"
  );

}


// 播放完自動下一首
audio.addEventListener("ended", () => {
  nextSong();
});


// 開始讀取
loadSongs();

</script>

</body>
</html>
