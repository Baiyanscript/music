<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funk Media Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .player {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    .now-playing,
    .playlist {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    #fileName {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }

    #mediaPlayer {
      display: block;
      width: 100%;
      max-height: 65vh;
      background: #000;
      border-radius: 8px;
    }

    audio#mediaPlayer {
      max-height: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    button,
    select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:hover,
    button.active {
      background: #555;
    }

    .song {
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .song:hover {
      background: #333;
    }

    .song.active {
      background: #444;
      border-left: 3px solid #fff;
    }

    .file-type {
      display: inline-block;
      min-width: 52px;
      margin-right: 8px;
      color: #aaa;
      font-size: 12px;
    }

    #status {
      padding: 16px 4px;
      text-align: center;
      color: #aaa;
      overflow-wrap: anywhere;
    }

    .error {
      color: #ff8888 !important;
    }

    .count {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 10px;
    }

    @media (max-width: 500px) {
      .player {
        padding: 12px;
      }

      h1 {
        font-size: 23px;
      }

      button {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="player">
    <h1>Funk Media Player</h1>

    <div class="now-playing">
      <div id="fileName">No file selected</div>

      <video
        id="mediaPlayer"
        controls
        playsinline
        preload="metadata"
        hidden>
      </video>

      <audio
        id="audioPlayer"
        controls
        preload="metadata"
        hidden>
      </audio>

      <div class="controls">
        <button id="previousButton">Previous</button>
        <button id="randomButton">Random: Off</button>
        <button id="nextButton">Next</button>
      </div>
    </div>

    <div class="playlist">
      <div id="count" class="count"></div>
      <div id="status">Loading files from GitHub...</div>
      <div id="playlist"></div>
    </div>
  </div>

  <script>
    const API_URL =
      "https://api.github.com/repos/Baiyanscript/music/contents/funk";

    const RAW_URL =
      "https://raw.githubusercontent.com/Baiyanscript/music/main/funk/";

    const video = document.getElementById("mediaPlayer");
    const audio = document.getElementById("audioPlayer");
    const fileName = document.getElementById("fileName");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const randomButton = document.getElementById("randomButton");

    let files = [];
    let currentIndex = -1;
    let randomMode = false;

    function getExtension(name) {
      const dot = name.lastIndexOf(".");
      return dot >= 0 ? name.slice(dot).toLowerCase() : "";
    }

    function getFileType(name) {
      const ext = getExtension(name);

      if (ext === ".mp3") return "MP3";
      if (ext === ".mp4") return "MP4";
      if (ext === ".webm") return "WEBM";

      return "";
    }

    async function loadFiles() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          if (response.status === 403) {
            throw new Error(
              "GitHub API rate limit reached. Please try again later."
            );
          }

          throw new Error(
            "GitHub request failed: " + response.status
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("Invalid GitHub folder response.");
        }

        files = data
          .filter(item =>
            item.type === "file" &&
            [".mp3", ".mp4", ".webm"].includes(
              getExtension(item.name)
            )
          )
          .sort((a, b) =>
            a.name.localeCompare(b.name)
          );

        if (files.length === 0) {
          status.textContent = "No MP3, MP4 or WEBM files found.";
          return;
        }

        status.hidden = true;
        count.textContent = "Files found: " + files.length;

        files.forEach((file, index) => {
          const item = document.createElement("div");
          item.className = "song";

          const type = document.createElement("span");
          type.className = "file-type";
          type.textContent = getFileType(file.name);

          const name = document.createElement("span");
          name.textContent = file.name;

          item.append(type, name);
          item.addEventListener("click", () => playFile(index));

          playlist.appendChild(item);
        });

        playFile(0, false);

      } catch (error) {
        console.error(error);
        status.className = "error";
        status.textContent = "Unable to load files: " + error.message;
      }
    }

    function playFile(index, autoplay = true) {
      if (!files[index]) return;

      currentIndex = index;

      const file = files[index];
      const ext = getExtension(file.name);
      const url = RAW_URL +
        file.name.split("/").map(encodeURIComponent).join("/");

      fileName.textContent = file.name;

      const isAudio = ext === ".mp3";

      if (isAudio) {
        video.pause();
        video.removeAttribute("src");
        video.load();
        video.hidden = true;

        audio.hidden = false;
        audio.src = url;
        audio.load();

        if (autoplay) {
          audio.play().catch(() => {});
        }
      } else {
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        audio.hidden = true;

        video.hidden = false;
        video.src = url;
        video.load();

        if (autoplay) {
          video.play().catch(() => {});
        }
      }

      updateActiveFile();
    }

    function updateActiveFile() {
      document.querySelectorAll(".song").forEach((item, index) => {
        item.classList.toggle("active", index === currentIndex);
      });
    }

    function nextFile() {
      if (!files.length) return;

      let index;

      if (randomMode && files.length > 1) {
        do {
          index = Math.floor(Math.random() * files.length);
        } while (index === currentIndex);
      } else {
        index = (currentIndex + 1) % files.length;
      }

      playFile(index);
    }

    function previousFile() {
      if (!files.length) return;

      const index =
        (currentIndex - 1 + files.length) % files.length;

      playFile(index);
    }

    function toggleRandom() {
      randomMode = !randomMode;
      randomButton.textContent =
        randomMode ? "Random: On" : "Random: Off";
      randomButton.classList.toggle("active", randomMode);
    }

    document.getElementById("previousButton")
      .addEventListener("click", previousFile);

    document.getElementById("nextButton")
      .addEventListener("click", nextFile);

    randomButton.addEventListener("click", toggleRandom);

    audio.addEventListener("ended", nextFile);
    video.addEventListener("ended", nextFile);

    loadFiles();
  </script>
</body>
</html>
