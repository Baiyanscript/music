<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funk Media Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .player {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    .now-playing,
    .section {
      background: #1d1d1d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    #fileName {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }

    #videoPlayer {
      display: block;
      width: 100%;
      max-height: 65vh;
      background: #000;
      border-radius: 8px;
    }

    #audioPlayer {
      width: 100%;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover,
    button.active {
      background: #555;
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .section-count {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .song {
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .song:hover {
      background: #333;
    }

    .song.active {
      background: #444;
      border-left: 3px solid #fff;
    }

    #status {
      padding: 15px;
      text-align: center;
      color: #aaa;
    }

    .error {
      color: #ff8888 !important;
    }

    @media (max-width: 500px) {
      .player {
        padding: 12px;
      }

      h1 {
        font-size: 23px;
      }

      button {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="player">
    <h1>Funk Media Player</h1>

    <div class="now-playing">
      <div id="fileName">No file selected</div>

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        hidden>
      </video>

      <audio
        id="audioPlayer"
        controls
        preload="metadata"
        hidden>
      </audio>

      <div class="controls">
        <button id="previousButton">Previous</button>
        <button id="randomButton">Random: Off</button>
        <button id="nextButton">Next</button>
      </div>
    </div>

    <div id="status">Loading files from GitHub...</div>

    <div class="section">
      <h2>MP3</h2>
      <div id="mp3Count" class="section-count">0 files</div>
      <div id="mp3List"></div>
    </div>

    <div class="section">
      <h2>MP4</h2>
      <div id="mp4Count" class="section-count">0 files</div>
      <div id="mp4List"></div>
    </div>

    <div class="section">
      <h2>WEBM</h2>
      <div id="webmCount" class="section-count">0 files</div>
      <div id="webmList"></div>
    </div>
  </div>

  <script>
    const API_URL =
      "https://api.github.com/repos/Baiyanscript/music/contents/funk";

    const RAW_URL =
      "https://raw.githubusercontent.com/Baiyanscript/music/main/funk/";

    const video = document.getElementById("videoPlayer");
    const audio = document.getElementById("audioPlayer");
    const fileName = document.getElementById("fileName");
    const status = document.getElementById("status");
    const randomButton = document.getElementById("randomButton");

    const sections = {
      ".mp3": {
        list: document.getElementById("mp3List"),
        count: document.getElementById("mp3Count")
      },
      ".mp4": {
        list: document.getElementById("mp4List"),
        count: document.getElementById("mp4Count")
      },
      ".webm": {
        list: document.getElementById("webmList"),
        count: document.getElementById("webmCount")
      }
    };

    let files = [];
    let currentIndex = -1;
    let randomMode = false;

    function getExtension(name) {
      const dot = name.lastIndexOf(".");
      return dot >= 0 ? name.slice(dot).toLowerCase() : "";
    }

    async function loadFiles() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          if (response.status === 403) {
            throw new Error(
              "GitHub API rate limit reached. Try again later."
            );
          }

          throw new Error(
            "GitHub request failed: " + response.status
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("Invalid GitHub folder response.");
        }

        files = data
          .filter(item =>
            item.type === "file" &&
            Object.keys(sections).includes(
              getExtension(item.name)
            )
          )
          .sort((a, b) => a.name.localeCompare(b.name));

        Object.values(sections).forEach(section => {
          section.list.replaceChildren();
        });

        files.forEach((file, index) => {
          const ext = getExtension(file.name);
          const section = sections[ext];

          const item = document.createElement("div");
          item.className = "song";
          item.textContent = file.name;

          item.addEventListener("click", () => {
            playFile(index);
          });

          section.list.appendChild(item);
        });

        Object.entries(sections).forEach(([ext, section]) => {
          const total = files.filter(
            file => getExtension(file.name) === ext
          ).length;

          section.count.textContent = total + " files";
        });

        if (files.length === 0) {
          status.textContent =
            "No MP3, MP4 or WEBM files found.";
          return;
        }

        status.hidden = true;
        playFile(0, false);

      } catch (error) {
        console.error(error);
        status.className = "error";
        status.textContent =
          "Unable to load files: " + error.message;
      }
    }

    function playFile(index, autoplay = true) {
      if (!files[index]) return;

      currentIndex = index;

      const file = files[index];
      const ext = getExtension(file.name);

      const url = RAW_URL +
        file.name.split("/").map(encodeURIComponent).join("/");

      fileName.textContent = file.name;

      if (ext === ".mp3") {
        video.pause();
        video.removeAttribute("src");
        video.load();
        video.hidden = true;

        audio.hidden = false;
        audio.src = url;
        audio.load();

        if (autoplay) {
          audio.play().catch(() => {});
        }
      } else {
        audio.pause();
        audio.removeAttribute("src");
        audio.load();
        audio.hidden = true;

        video.hidden = false;
        video.src = url;
        video.load();

        if (autoplay) {
          video.play().catch(() => {});
        }
      }

      updateActiveFile();
    }

    function updateActiveFile() {
      document.querySelectorAll(".song").forEach(item => {
        item.classList.remove("active");
      });

      const ext = getExtension(files[currentIndex].name);
      const section = sections[ext];

      const items = section.list.querySelectorAll(".song");
      const sectionFiles = files.filter(
        file => getExtension(file.name) === ext
      );

      const localIndex = sectionFiles.findIndex(
        file => file.name === files[currentIndex].name
      );

      if (items[localIndex]) {
        items[localIndex].classList.add("active");
      }
    }

    function nextFile() {
      if (!files.length) return;

      let index;

      if (randomMode && files.length > 1) {
        do {
          index = Math.floor(Math.random() * files.length);
        } while (index === currentIndex);
      } else {
        index = (currentIndex + 1) % files.length;
      }

      playFile(index);
    }

    function previousFile() {
      if (!files.length) return;

      const index =
        (currentIndex - 1 + files.length) % files.length;

      playFile(index);
    }

    function toggleRandom() {
      randomMode = !randomMode;

      randomButton.textContent =
        randomMode ? "Random: On" : "Random: Off";

      randomButton.classList.toggle("active", randomMode);
    }

    document.getElementById("previousButton")
      .addEventListener("click", previousFile);

    document.getElementById("nextButton")
      .addEventListener("click", nextFile);

    randomButton.addEventListener("click", toggleRandom);

    audio.addEventListener("ended", nextFile);
    video.addEventListener("ended", nextFile);

    loadFiles();
  </script>
</body>
</html>
